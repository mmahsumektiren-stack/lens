name: Lens Seçim APK

on:
  push:
    branches: [main, dev]
    paths: ['android/**', 'readability.js', 'page-extract.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: İmza parolası var mı
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::KS_PASS gizli değeri yok. Repo → Settings → Secrets and variables → Actions → New repository secret → Name: KS_PASS"
            exit 1
          fi

      - name: APK derle
        env:
          KS_FILE: ${{ github.workspace }}/android/lens.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
          LENS_DEV: ${{ github.ref_name == 'dev' && '1' || '0' }}
        run: |
          set -o pipefail
          if ! ./android/build.sh 2>&1 | tee build.log; then
            tail -n 25 build.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: lens-secim-${{ github.ref_name }}
          path: android/build/*.apk

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            # test sürümü: asıl indirme bağlantısına dokunmaz
            gh release view secim-test >/dev/null 2>&1 || gh release create secim-test --prerelease --title "Lens Test Seçim (test sürümü)" \
              --target dev --notes "Test sürümü. Asıl Lens Seçim'in yanına kurulur, Lens Test'i açar."
            gh release upload secim-test android/build/lens-secim-test.apk --clobber
          else
            gh release view secim >/dev/null 2>&1 || gh release create secim --title "Lens Seçim (Android)" \
              --notes "Seçim menüsüne Lens ekleyen yardımcı uygulama. lens-secim.apk dosyasını telefona indirip kur."
            gh release upload secim android/build/lens-secim.apk --clobber
          fi
